<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Square-1 3D · Cube Space Studio</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .sq1-standalone {
        width: min(960px, 100%);
        padding: 22px 24px;
        border-radius: var(--r-xl);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        box-shadow: inset 0 1px 0 var(--bevel-top), var(--shadow-card);
      }

      .sq1-standalone-title {
        margin: 0 0 14px;
        color: var(--ink);
        font-family: var(--font-num);
        font-size: 22px;
        font-weight: 700;
        text-align: center;
      }

      .sq1-standalone-scramble {
        margin: 0 0 18px;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-sunken);
        color: var(--ink);
        font-family: var(--font-alg);
        font-size: clamp(14px, 2vw, 19px);
        line-height: 1.65;
        text-align: center;
      }

      .sq1-standalone .sq1-viewer {
        height: min(68vh, 640px);
        border-radius: 16px;
        border: 1px solid var(--line);
        background:
          radial-gradient(
            ellipse 68% 62% at 50% 48%,
            var(--stage-spot-inner) 0%,
            var(--stage-spot-mid) 46%,
            transparent 78%
          ),
          var(--surface-sunken);
      }
    </style>
  </head>
  <body data-theme="obsidian" data-mode="dark">
    <main class="sq1-standalone">
      <h1 class="sq1-standalone-title">Square-1 3D</h1>
      <div id="standaloneScramble" class="sq1-standalone-scramble"></div>
      <div id="sq1Viewer" class="sq1-viewer"></div>
    </main>

    <script src="vendor/legacy-three/three.min.js"></script>
    <script src="vendor/legacy-three/OrbitControls.js"></script>
    <script src="js/sq1-viewer.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const scramble = params.get("alg") || "";
      document.getElementById("standaloneScramble").textContent =
        scramble || "No scramble";
      window.Sq1Viewer.show();
      window.Sq1Viewer.applyScramble(scramble);
    </script>
  </body>
</html>
